<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сервисная книжка КРС</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Книжка КРС">
<meta name="theme-color" content="#161717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* «Пульт»: серая шкала как на пультах управления (ISA-101), цвет — только при отклонении и всегда со словом.
   Без градиентов и теней. Скругление 2 px. Цифры — моноширинные. Решения — docs/adr/0001–0005. */
:root{
 --bg:#DCDDDB;--surface:#F2F2F0;--sunk:#CFD0CE;--line:#A9ABA8;--ink:#161717;--mute:#5A5D5C;
 --attention:#9A5C00;--attention-line:#B86E00;--critical:#C4161C;--on-critical:#FFFFFF;
 --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --tab:54px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121314;--surface:#1C1E1F;--sunk:#0C0D0D;--line:#3A3D3F;--ink:#E6E7E5;--mute:#9A9EA0;
 --attention:#F0A400;--attention-line:#F0A400;--critical:#FF4D4D;--on-critical:#121314;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#121314;--surface:#1C1E1F;--sunk:#0C0D0D;--line:#3A3D3F;--ink:#E6E7E5;--mute:#9A9EA0;
 --attention:#F0A400;--attention-line:#F0A400;--critical:#FF4D4D;--on-critical:#121314;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.u{font-size:.75em;color:var(--mute);margin-left:3px;font-family:var(--sans)}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--tab) + 28px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
.toprow{display:flex;align-items:center;gap:10px}
.toprow h1{flex:1;margin:0;font-size:18px;font-weight:700;font-variation-settings:"wdth" 85;letter-spacing:.01em}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:6px 9px;font-size:13px;white-space:nowrap;min-height:36px}
.sync svg.i{width:16px;height:16px}
.sync.q{border:2px solid var(--attention-line);color:var(--attention);font-weight:600}
.demo{margin:10px 16px 0;font-size:13px;color:var(--mute);border:1px dashed var(--line);border-radius:2px;padding:8px 10px}
main{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sec{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:8px 0 -4px;font-variation-settings:"wdth" 85}
.box{background:var(--surface);border:1px solid var(--line);border-radius:2px}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:48px;width:100%;text-align:left;background:none;border:0}
button.row:active{background:var(--sunk)}
.grow{flex:1;min-width:0}
.nm{font-weight:600;line-height:1.25}
.mt{font-size:13.5px;color:var(--mute);margin-top:2px}
.st{font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:2px;white-space:nowrap;letter-spacing:.02em}
.st.crit{background:var(--critical);color:var(--on-critical)}
.st.att{border:2px solid var(--attention-line);color:var(--attention)}
.st.mute{color:var(--mute);font-weight:600;padding-inline:0}
.st.none{border:1px dashed var(--line);color:var(--mute);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 14px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px}
.btn.sec2{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.wide{width:100%}
.btn:active{transform:translateY(1px)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{flex:1 1 140px}
.note{font-size:13.5px;color:var(--mute);margin:0}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font-size:14px}
.due{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left;border-radius:2px;background:var(--surface);border:2px solid var(--attention-line)}
.due.crit{border-color:var(--critical)}
.well{display:flex;align-items:center;gap:10px;padding:12px 14px}
.well b{font-size:17px}
.hrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
.hrow .nm{font-size:15px}
.hin{width:66px;height:42px;text-align:right;padding:0 10px;border:1px solid var(--line);border-radius:2px;background:var(--bg);font-family:var(--mono);font-size:18px;font-weight:600}
.hin::placeholder{color:var(--mute);font-weight:400}
.hin.same{color:var(--mute)}
.ic{width:42px;height:42px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:var(--surface);position:relative}
.ic.on::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.allsame{display:flex;justify-content:flex-end;padding:8px 14px 10px}
.lube{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab)}
nav.tabs button{border:0;background:none;font-size:10.5px;white-space:nowrap;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
nav.tabs button svg.i{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--ink)}
nav.tabs .cnt{position:absolute;top:6px;left:calc(50% + 8px);background:var(--critical);color:var(--on-critical);font-size:10.5px;font-weight:700;border-radius:2px;padding:0 4px;line-height:16px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:94%;overflow:auto;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.shead{display:flex;align-items:flex-start;gap:10px}
.shead h2{flex:1;margin:0;font-size:20px;line-height:1.2;font-variation-settings:"wdth" 85}
.x{width:44px;height:44px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:2px;background:var(--surface)}
.plate{background:var(--ink);color:var(--bg);border-radius:2px;padding:14px}
.plate .k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.plate .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1.1;margin-top:4px}
.plate .big .u{color:var(--bg);opacity:.75}
.plate .stl{margin-top:8px;font-weight:600}
.ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 14px}
.ev .d{font-family:var(--mono);font-size:13px;color:var(--mute)}
.ev.ann .nm,.ev.ann .tx{text-decoration:line-through;color:var(--mute)}
.tx{font-size:14.5px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs img{width:60px;height:60px;object-fit:cover;border-radius:2px;border:1px solid var(--line)}
.bar{height:6px;background:var(--sunk);border-radius:1px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mute)}
.bar i.crit{background:var(--critical)}.bar i.att{background:var(--attention-line)}
.ck{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ck .req{font-size:13px;color:var(--mute)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{min-height:44px;border:1px solid var(--line);border-radius:2px;background:var(--surface);font-size:13.5px;font-weight:600}
.seg3 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg3 button.warn[aria-pressed="true"]{background:var(--surface);color:var(--attention);border:2px solid var(--attention-line)}
textarea,input.f{width:100%;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:10px 12px;min-height:46px}
textarea{resize:vertical}
label.fl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--mute)}
.photo{position:relative;overflow:hidden}
.photo input{position:absolute;inset:0;opacity:0}
.prog{font-family:var(--mono);font-size:14px}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gt{position:relative;width:max-content}
.gr{display:grid;grid-template-columns:96px var(--tw);min-height:50px;border-top:1px solid var(--line)}
.gr.h{min-height:32px;border-top:0}
.gn{position:sticky;left:0;z-index:3;background:var(--surface);padding:6px 6px 6px 12px;display:flex;flex-direction:column;justify-content:center;border:0;border-right:1px solid var(--line);font-size:13px;font-weight:600;line-height:1.15;text-align:left}
.gtl{position:relative;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px var(--wk));background-position-x:var(--wk0)}
.gr.h .gtl{background:none}
.mo{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--mute);padding:9px 0 0 5px;text-transform:uppercase;letter-spacing:.05em}
.gb{position:absolute;top:50%;height:14px;margin-top:-10px;border-radius:1px;overflow:hidden;background:var(--sunk)}
.gb i{position:absolute;left:0;top:0;bottom:0;background:var(--bf,var(--mute))}
.gb.done{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.gb.late{background:var(--critical)}
.gb.next{background:none;box-shadow:inset 0 0 0 1px var(--line);background-image:repeating-linear-gradient(-45deg,var(--line) 0 1px,transparent 1px 6px)}
.base{position:absolute;top:50%;height:3px;margin-top:7px;background:var(--ink);opacity:.35}
.ms{position:absolute;top:50%;width:10px;height:10px;margin:-8px 0 0 -5px;transform:rotate(45deg);background:var(--ink);z-index:1}
.gl{position:absolute;top:50%;margin-top:-11px;font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap;padding:1px 5px;margin-left:4px;background:var(--surface);z-index:4;line-height:18px}
.gl.n{font-family:var(--sans);font-weight:400;color:var(--mute)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);z-index:2;pointer-events:none}
.today span{position:absolute;top:3px;left:4px;font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);padding:0 4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mute);padding:10px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .gb,.legend .ms,.legend .base{position:relative;top:auto;margin:0;display:inline-block}
.legend .gb{width:26px}
table.nt{width:100%;border-collapse:collapse;font-size:14px}
table.nt td,table.nt th{padding:9px 12px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.nt th{font-size:12px;color:var(--mute);border-top:0;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.src{font-size:12.5px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:2px;padding:10px 14px;font-size:14px;z-index:20;max-width:90%}
.empty{padding:20px 14px;text-align:center;color:var(--mute);font-size:14px}

/* Роли и правка парка (ADR 0006) */
.roles{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
#roles{display:flex;flex-wrap:wrap;gap:4px}
#roles button{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:4px 8px;font-size:13px;min-height:32px}
#roles button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
#demoTx[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:2px;padding:8px 10px;font-size:14px;min-height:40px;text-align:left}
select.f{width:100%;border:1px solid var(--line);border-radius:2px;background:var(--surface);padding:10px 12px;min-height:46px;color:var(--ink);font:inherit}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
.erow{display:grid;grid-template-columns:1fr;gap:6px;padding:10px 14px;position:relative}
.erow .x{justify-self:end}
.chk{display:flex;align-items:center;gap:10px;font-size:15px}.chk input{width:22px;height:22px;flex:none}
.btn.danger{color:var(--critical);border-color:var(--critical);background:var(--surface)}
.park-g .gh{min-height:34px;padding:6px 14px;background:var(--sunk)}
.sheet-in.wide{max-width:900px}
@media (min-width:760px){
 body.wide .app{max-width:980px}
 .grid2{grid-template-columns:1fr 1fr;gap:12px 16px}
 .erow{grid-template-columns:2fr 1.4fr 1.4fr auto;align-items:center}
 .erow.two{grid-template-columns:1fr 1.6fr auto}
}

/* Вход */
.login{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:16px}
.login[hidden]{display:none}
.login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0;font-size:24px;font-variation-settings:"wdth" 85}
.login .err{color:var(--critical);font-size:14px;min-height:1.2em}

/* ===== ПК: меню слева, содержимое на всю ширину, панели справа (13.10) ===== */
@media (min-width:1000px){
 body{font-size:14px}
 .app{max-width:none;margin:0 0 0 216px;padding-bottom:24px}
 body.wide .app{max-width:none}
 header.top{padding:14px 28px}
 .toprow h1{font-size:20px}
 .demo{margin:12px 28px 0}
 main{padding:16px 28px 28px;max-width:1240px}
 nav.tabs{top:0;right:auto;width:216px;border-top:0;border-right:1px solid var(--line);padding:0}
 nav.tabs>div{max-width:none;display:flex!important;flex-direction:column;height:auto;padding:14px 10px;gap:2px}
 nav.tabs>div::before{content:"Сервисная книжка КРС";font-weight:700;font-size:15px;padding:4px 10px 16px;font-variation-settings:"wdth" 85}
 nav.tabs button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:9px 10px;border-radius:2px;color:var(--ink)}
 nav.tabs button svg.i{width:19px;height:19px}
 nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
 nav.tabs button[aria-current="page"]::before{display:none}
 nav.tabs .cnt{position:static;margin-left:auto}
 .row{min-height:40px;padding:8px 14px}
 .nm{font-size:14px}.mt{font-size:12.5px}
 .btn{min-height:38px;padding:8px 14px;font-size:14px}
 .btns .btn{flex:0 1 auto}
 .btn.wide{width:auto;align-self:flex-start;min-width:240px}
 .x{width:36px;height:36px}
 .hrow{min-height:44px;padding:6px 14px}.hin{height:36px}.ic{width:36px;height:36px}
 textarea,input.f,select.f{min-height:36px;padding:7px 10px}
 .toast{bottom:20px}
 /* панель справа вместо листа снизу */
 .sheet{top:0;left:auto;right:0;bottom:0;max-height:none;width:min(640px,48vw);border-top:0;border-left:1px solid var(--line);padding:16px 22px 24px}
 .sheet .sheet-in{max-width:none}
 .sheet.w{width:min(980px,66vw)}
 .scrim{background:rgba(0,0,0,.18)}
 /* «Парк»: список и карточка рядом, без затемнения */
 body.park-open .scrim{display:none}
 body.park-open .sheet{width:min(820px,56vw)}
 body.park-open main{margin-right:min(820px,56vw);max-width:none}
 .grid2{grid-template-columns:1fr 1fr 1fr}
 .plate .big{font-size:26px}
}
</style>

</head>
<body>
<div class="app">
 <header class="top"><div class="toprow"><h1 id="ttl">Сводка</h1><button class="sync" id="sync" type="button"></button></div></header>
 <div class="demo" id="rolesBox" hidden><div class="roles"><span>Администратор — смотреть как:</span><span id="roles"></span></div></div>
 <main id="view"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden><div class="sheet-in" id="sheetIn"></div></div>
<div class="login" id="login" hidden><form id="loginF"><h1>Сервисная книжка КРС</h1><p class="note">ООО «Победит Холдинг» · вход для сотрудников</p>
 <label class="fl">Почта<input class="f" type="email" id="lgE" autocomplete="username" required></label>
 <label class="fl">Пароль<input class="f" type="password" id="lgP" autocomplete="current-password" required></label>
 <div class="err" id="lgErr" role="alert"></div><button class="btn wide" id="lgB">Войти</button>
 <p class="note">Нет доступа или забыли пароль — к администратору.</p></form></div>

<script>
/* ================== обёртка Supabase ==================
   Все обращения к базе — только здесь (как в «Статус ГДТ»). Остальной код знает только функции makeDb.
   Публичный ключ виден всем — это нормально; секретный ключ сюда не попадает никогда. В браузере supabase-js хранит
   в localStorage только сессию входа. */
const SB_URL = 'https://dwndotktxomjlzuwmjer.supabase.co';
const SB_KEY = 'sb_publishable_dtscIxr3e4JOtFdCfpqKdA_ABCJpY61';   // публичный ключ (sb_publishable_…)
const DB_TABLES = ['refs', 'units', 'norms', 'book', 'hours', 'repairs', 'pend', 'well', 'log'];
const DB_KEYS = { refs: ['key'], units: ['id'], norms: ['unit_id', 'id'], book: ['id'], hours: ['unit_id', 'day'],
  repairs: ['id'], pend: ['id'], well: ['id'], log: ['ck'] };

function makeDb(createClient, url = SB_URL, key = SB_KEY) {
  const sb = createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
  const chk = ({ data, error }) => { if (error) { const e = new Error(error.message || String(error)); e.code = error.code; throw e; } return data; };
  let chanSeq = 0;
  return {
    async session() { return chk(await sb.auth.getSession()).session; },
    async signIn(email, password) { return chk(await sb.auth.signInWithPassword({ email, password })).user; },
    async signOut() { await sb.auth.signOut(); },
    // Кто вошёл: имя, роль, права {действие: true/false}; null — вошёл, но роли нет.
    async me() {
      const s = await this.session();
      if (!s) return null;
      const p = chk(await sb.from('profiles').select('user_id,name,role').eq('user_id', s.user.id));
      if (!p || !p.length) return null;
      const perms = chk(await sb.from('permissions').select('*'));
      const can = Object.fromEntries(perms.map(r => [r.action, !!r[p[0].role]]));
      return { uid: s.user.id, email: s.user.email, name: p[0].name || s.user.email, role: p[0].role, can };
    },
    async load() {
      const out = {};
      await Promise.all(DB_TABLES.map(async t => { out[t] = chk(await sb.from(t).select('*')); }));
      return out;
    },
    // Одна операция из очереди: {t, op: 'upsert' | 'insert' | 'delete', row}
    async op(o) {
      const q = sb.from(o.t);
      if (o.op === 'insert') chk(await q.insert(o.row));
      else if (o.op === 'upsert') chk(await q.upsert(o.row, { onConflict: DB_KEYS[o.t].join(',') }));
      else if (o.op === 'delete') { let d = q.delete(); for (const k of DB_KEYS[o.t]) d = d.eq(k, o.row[k]); chk(await d); }
    },
    subscribe(onChange, onStatus) {
      let ch = null, off = false;
      (async () => {
        const s = (await sb.auth.getSession()).data.session;
        if (s && sb.realtime) await sb.realtime.setAuth(s.access_token);
        if (off) return;
        ch = sb.channel('service-' + (++chanSeq));
        for (const t of DB_TABLES) ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, () => onChange(t));
        ch.subscribe(st => onStatus && onStatus(st));
      })().catch(e => onStatus && onStatus('CHANNEL_ERROR', e));
      return () => { off = true; if (ch) sb.removeChannel(ch); };
    }
  };
}

// Ошибка базы → понятный человеку текст; kind: net — нет связи (повторить позже), dup — уже есть (не ошибка), deny — отказ.
function dbErr(e) {
  const m = (e && e.message) || String(e);
  if (/Failed to fetch|NetworkError|Load failed|ERR_|network|timeout/i.test(m)) return { kind: 'net', text: 'нет связи с сервером' };
  if ((e && e.code === '23505') || /duplicate key/i.test(m)) return { kind: 'dup', text: 'уже есть' };
  if (/Invalid login credentials/i.test(m)) return { kind: 'deny', text: 'неверная почта или пароль' };
  if (/Email not confirmed/i.test(m)) return { kind: 'deny', text: 'почта не подтверждена — администратору: Auto Confirm у пользователя' };
  if (/permission denied|row-level security|42501/i.test(m)) return { kind: 'deny', text: 'нет прав на это действие' };
  if (/foreign key|violates/i.test(m)) return { kind: 'deny', text: 'база не приняла: ' + m.slice(0, 160) };
  return { kind: 'deny', text: m.slice(0, 200) };
}

/* ================== Данные: база ↔ экран, очередь отправки, кэш в телефоне ==================
   Экран работает с объектом S, как в макете. После каждой правки save() сравнивает S со снимком (BASE) и кладёт
   отличия в очередь (OUTBOX) — она хранится в телефоне (IndexedDB) и уходит в базу, когда есть связь
   (CLAUDE.md, правило 4). Записи книжки и журнала только добавляются; их id создаётся в телефоне — повтор не дублирует. */

const newId = () => (crypto.randomUUID ? crypto.randomUUID()
  : "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)));

/* ---- IndexedDB: маленькое хранилище «ключ → значение» ---- */
const IDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("service-kniga", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("kv", mode), st = t.objectStore("kv"), q = fn(st);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {
    get: k => tx("readonly", st => st.get(k)).catch(() => undefined),
    set: (k, v) => tx("readwrite", st => st.put(v, k)).catch(() => undefined),
    clear: () => tx("readwrite", st => st.clear()).catch(() => undefined)
  };
})();

/* ---- строки базы → S ---- */
function localDT(ts) { return ts ? MSK(ts) : { date: null, time: "" }; }   // по Москве
function fromRows(R, pendingIds) {
  const ref = k => (R.refs.find(r => r.key === k) || {}).data;
  CHECK = ref("checklists") || {}; LUBE = ref("lube") || { items: [], hydro: { conflict: "" } };
  const fixed = new Set(R.book.filter(b => b.fixes).map(b => b.fixes));
  const units = [...R.units].sort((a, b) => a.pos - b.pos || a.id.localeCompare(b.id)).map(u => ({
    id: u.id, pos: u.pos, name: u.name, type: u.type || "", sn: u.sn || "", made: u.made || "", maker: u.maker || "",
    start: u.start || "", doc: u.doc || "", grp: u.grp || "", parent: u.parent || "", agg: !!u.agg, hours: !!u.hours,
    note: u.note || "", params: u.params || [], limits: u.limits || [], off: u.off || null,
    norms: R.norms.filter(n => n.unit_id === u.id).map(n => ({ ...n.data, id: n.id, v: n.v, since: n.since, ...(n.off ? { off: true } : {}) }))
  }));
  const hours = {}; let last = null;
  for (const h of R.hours) { (hours[h.unit_id] ??= {})[h.day] = h.h; if (h.at && (!last || h.at > last)) last = h.at; }
  const book = R.book.map(b => ({ id: b.id, u: b.unit_id, n: b.norm_id, date: b.date, kind: b.kind, text: b.text || "", photos: b.photos || [],
    fixes: b.fixes || null, ns: b.ns || "", by: b.by_name || "", annulled: fixed.has(b.id), sync: pendingIds.has(b.id) ? "phone" : "sent" }));
  const repairs = R.repairs.map(r => ({ id: r.id, u: r.unit_id, opened: r.opened, desc: r.descr, zip: r.zip, closed: r.closed }));
  const pend = R.pend.map(p => ({ id: p.id, u: p.unit_id, n: p.norm_id, date: p.date, why: p.why, done: p.done }));
  const w = R.well[0];
  const log = [...R.log].sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))).map(l => {
    const t = localDT(l.at); return { ck: l.ck, date: t.date || TODAY, time: t.time, by: l.who || "", u: l.unit_id, n: l.norm_id, what: l.what, before: l.before || "", after: l.after || "", why: l.why || "" }; });
  return { units, hours, book, repairs, pend, log, well: w ? { kust: w.kust, well: w.well, since: w.since || TODAY } : { kust: "", well: "", since: TODAY },
    lastSent: last ? localDT(last) : { date: null, time: "" } };
}

/* ---- S → строки (только то, что сайт пишет) ---- */
const normData = n => { const d = { ...n }; for (const k of ["id", "v", "since", "off"]) delete d[k]; return d; };
function toRows(S) {
  const r = { units: [], norms: [], book: [], hours: [], repairs: [], pend: [], well: [], log: [] };
  S.units.forEach(u => {
    r.units.push({ id: u.id, pos: u.pos || 0, name: u.name, type: u.type || "", sn: u.sn || "", made: u.made || "", maker: u.maker || "",
      start: u.start || null, doc: u.doc || "", grp: u.grp || "", parent: u.parent || null, agg: !!u.agg, hours: !!u.hours,
      note: u.note || "", params: u.params || [], limits: u.limits || [], off: u.off || null });
    u.norms.forEach(n => r.norms.push({ unit_id: u.id, id: n.id, data: normData(n), off: !!n.off }));
  });
  S.book.forEach(b => r.book.push({ id: b.id, unit_id: b.u, norm_id: b.n || null, date: b.date, kind: b.kind, text: b.text || "",
    photos: b.photos || [], fixes: b.fixes || null, ns: b.ns || "", client_at: b.client_at || null }));
  for (const u in S.hours) for (const d in S.hours[u]) if (S.hours[u][d] != null) r.hours.push({ unit_id: u, day: d, h: +S.hours[u][d] });
  S.repairs.forEach(x => r.repairs.push({ id: x.id, unit_id: x.u, opened: x.opened, descr: x.desc, zip: x.zip || null, closed: x.closed || null }));
  S.pend.forEach(p => r.pend.push({ id: p.id, unit_id: p.u, norm_id: p.n, date: p.date, why: p.why || "", done: p.done || null }));
  if (S.well && S.well.kust) r.well.push({ id: 1, kust: S.well.kust, well: S.well.well, since: S.well.since || null });
  S.log.forEach(l => r.log.push({ ck: l.ck, unit_id: l.u || null, norm_id: l.n || null, what: l.what, before: l.before || "", after: l.after || "", why: l.why || "" }));
  return r;
}

/* ---- отличия → операции ---- */
const rowKey = (t, row) => DB_KEYS[t].map(k => row[k]).join("|");
const INSERT_ONLY = { book: true, log: true };
function diffRows(base, cur) {
  const ops = [];
  for (const t in cur) {
    const was = new Map((base[t] || []).map(x => [rowKey(t, x), x]));
    for (const row of cur[t]) {
      const k = rowKey(t, row), old = was.get(k);
      if (!old) ops.push({ t, op: INSERT_ONLY[t] ? "insert" : "upsert", row });
      else if (!INSERT_ONLY[t] && JSON.stringify(old) !== JSON.stringify(row)) ops.push({ t, op: "upsert", row });
      was.delete(k);
    }
    if (t === "units") for (const row of was.values()) ops.push({ t, op: "delete", row: { id: row.id } });
  }
  // Порядок, в котором база примет: сначала единицы (на них ссылаются), удаления — в конце.
  const ord = ["units", "norms", "well", "hours", "repairs", "pend", "book", "log"];
  return ops.sort((a, b) => (a.op === "delete") - (b.op === "delete") || ord.indexOf(a.t) - ord.indexOf(b.t));
}

/* ---- очередь и синхронизация ---- */
function makeSync(db, hooks) {
  let outbox = [], running = false, timer = null;
  const persist = () => IDB.set("outbox", outbox);
  const api = {
    async init() { outbox = (await IDB.get("outbox")) || []; },
    get size() { return outbox.length; },
    pendingIds() { return new Set(outbox.filter(o => o.t === "book").map(o => o.row.id)); },
    pendingRows() { return outbox; },
    enqueue(ops) {
      for (const o of ops) {
        const k = o.t + "#" + rowKey(o.t, o.row);
        const i = outbox.findIndex(x => x.t + "#" + rowKey(x.t, x.row) === k && x.op === o.op);
        if (i >= 0 && o.op !== "insert") outbox[i] = o; else outbox.push(o);
      }
      persist(); api.kick();
    },
    kick() { clearTimeout(timer); timer = setTimeout(() => api.run(), 50); },
    async run() {
      if (running) return; running = true; let sent = 0, net = false;
      try {
        while (outbox.length) {
          const o = outbox[0];
          try { await db.op(o); sent++; }
          catch (e) {
            const x = dbErr(e);
            if (x.kind === "net") { net = true; break; }
            if (x.kind !== "dup") hooks.rejected(o, x.text);
          }
          outbox.shift(); persist();
        }
        if (!net) await hooks.reload(sent);
      } catch (e) { if (dbErr(e).kind !== "net") hooks.rejected(null, dbErr(e).text); net = true; }
      finally { running = false; hooks.status(net); if (net) { clearTimeout(timer); timer = setTimeout(() => api.run(), 20000); } }
    }
  };
  return api;

const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};

// Сутки и время — по Москве на любом телефоне: бригады подстраиваются под головной офис (решение 13.10).
const MSK=ts=>{const p=Object.fromEntries(new Intl.DateTimeFormat("ru-RU",{timeZone:"Europe/Moscow",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(ts?new Date(ts):new Date()).map(x=>[x.type,x.value]));return{date:p.year+"-"+p.month+"-"+p.day,time:p.hour+":"+p.minute}};
const TODAY=MSK().date;
const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];

function madeDate(s){if(!s)return null;s=String(s).trim();let m;
 if(m=s.match(/^(\d{4})-(\d\d)-(\d\d)$/))return s;
 if(m=s.match(/^(\d{1,2})\.(\d{4})$/))return m[2]+"-"+pad(+m[1])+"-01";
 if(m=s.match(/^(\d{4})$/))return m[1]+"-01-01";return null}

function calc(u,n){
 const unit=U(u),r={u,n,label:n.name,src:n.src};const a=avg(u);
 if(n.cnt==="daily")return null;
 const last=lastOf(u,[n.id,...(n.by||[])]);r.last=last;
 const p=pendOf(u,n.id);
 if(p){r.pend=p;const d=-diff(p.date,TODAY);r.eff=d<0?d:0;r.due=TODAY;r.lvl=d<0?"past":"week";r.txt="случилось: "+p.why.toLowerCase()+" ("+fmt(p.date)+") — нужно сделать";return r}
 if(n.cnt==="event"){r.lvl="event";r.txt="по событию: "+(n.trig||"—").toLowerCase();return r}
 if(n.cnt==="well"){const w=S.well;
  if(!w.kust){r.lvl="event";r.txt="на каждую скважину — куст и скважина ещё не указаны";return r}
  if(last&&last>=w.since){r.lvl="ok";r.eff=999;r.txt="на кусте "+w.kust+", скв. "+w.well+" сделано "+fmt(last);return r}
  const d=diff(w.since,TODAY);r.eff=d>0?-d:0;r.due=w.since;r.lvl=d>0?"past":"week";r.txt="на кусте "+w.kust+", скв. "+w.well+" не отмечено";return r}
 if(n.cnt==="life"){
  const base=n.base==="made"?madeDate(unit.made):(unit.start||null);r.base=base;
  if(n.years){if(!base){r.lvl="nodata";r.txt=n.base==="made"?"нет даты выпуска":"нет даты ввода в эксплуатацию";return r}
   r.due=addD(base,Math.round(n.years*365.25));r.eff=diff(TODAY,r.due);r.lvl=lvl(r.eff);r.txt=(r.eff<0?"истёк ":"до ")+fmt(r.due)+" · от "+(n.base==="made"?"выпуска":"ввода")+" "+fmt(base);return r}
  const from=last||base;if(!from){r.lvl="nodata";r.txt="нет даты ввода — от неё считается ресурс "+fmtN(n.h)+" ч";return r}
  r.of=n.h;r.used=hoursSince(u,from);r.left=r.of-r.used;r.eff=r.left<0?-1:(a>0?r.left/a:null);r.due=r.eff!=null&&r.eff>=0?addD(TODAY,Math.ceil(r.eff)):null;r.lvl=r.eff==null?"ok":lvl(r.eff);
  r.txt=fmtN(r.used)+" из "+fmtN(r.of)+" ч с "+fmt(from)+(r.due?" · ≈ "+fmt(r.due):"");return r}
 if(!last){r.lvl="none";r.txt="нет записи о выполнении";return r}
 if(n.days){r.period=n.days;r.dueCal=addD(last,n.days);r.days=diff(TODAY,r.dueCal)}
 if(n.h){r.of=n.h;r.used=hoursSince(u,last);r.left=r.of-r.used;r.dH=r.left<0?-1:(a>0?r.left/a:null)}
 const c=[r.days,r.dH].filter(x=>x!=null);r.eff=c.length?Math.min(...c):null;
 r.byH=r.dH!=null&&(r.days==null||r.dH<r.days);
 r.due=r.eff==null?null:(r.eff<0?(r.byH?TODAY:r.dueCal):addD(TODAY,Math.floor(r.eff)));
 r.lvl=lvl(r.eff);
 const t=[];if(r.left!=null)t.push(r.left<0?"перебег "+fmtN(-r.left)+" м/ч":"осталось "+fmtN(r.left)+" м/ч");
 if(r.days!=null)t.push(r.days<0?"по календарю просрочено "+(-r.days)+" сут":"по календарю до "+fmt(r.dueCal));
 r.txt=t.join(" · ");return r;

 let head=`<div class="gr h"><div class="gn" style="font-size:11.5px;color:var(--mute);font-weight:400">${fmt(D0)}–${fmt(D1)}</div><div class="gtl">`;
 for(let m=parse(D0);iso(m)<=D1;m=new Date(m.getFullYear(),m.getMonth()+1,1)){const s=iso(new Date(m.getFullYear(),m.getMonth(),1));head+=`<div class="mo" style="left:${X(s<D0?D0:s)}px">${MON[m.getMonth()]}</div>`}
 head+="</div></div>";
 const rows=st.map(r=>{let tl="";
  if(r.n.cnt==="life"){tl=r.lvl==="nodata"?`<div class="gl n" style="left:${X(TODAY)+4}px">нет даты ввода</div>`:`<div class="gl" style="left:${X(TODAY)+4}px">${fmtN(r.used)} из ${fmtN(r.of)} ч${r.due?" · ≈ "+fmt(r.due):""}</div>`}
  else{const dates=[...new Set(live(a.id).filter(e=>[r.n.id,...(r.n.by||[])].includes(e.n)).map(e=>e.date))].sort();const P=r.n.days;
   for(let i=0;i<dates.length-1;i++){const x=dates[i],y=dates[i+1];if(y<D0)continue;const due=P?addD(x,P):y,end=y>due?due:y;

   if(!n._orig){const y=clean({...n,id:"n"+uid(),v:1,since:TODAY});unit.norms.push(y);logit(unit.id,"Добавлена норма: "+y.name,n._why,"",normText(y));S.log[0].n=y.id;save();render();edFrom(unit.id);openSheet(vUnitEdit,true);toast("Норма добавлена");break}

   x.off=off||undefined;logit(unit.id,(off?"Норма убрана: ":"Норма возвращена: ")+x.name,NE._why);S.log[0].n=x.id;save();render();edFrom(unit.id);openSheet(vUnitEdit,true);break}

document.addEventListener("change",async e=>{const t=e.target;
 if(t.id==="n-cnt"&&NE){nGrab();refreshSheet();return}
 if(t.id==="e-agg"&&ED){edGrab();refreshSheet();return}

$("#sync").addEventListener("click",()=>{if(SYNC)SYNC.run();toast(S.queue?"Отправляю…":S.online?"Всё отправлено":"Нет связи — всё сохранено в телефоне")});
document.addEventListener("input",e=>{const t=e.target;
 if(t.classList.contains("hin")){t.value=t.value.replace(/\D/g,"").slice(0,2);const d=draft(t.dataset.u);d.h=t.value===""?null:+t.value;d.same=false;t.classList.remove("same");save()}
 if(t.dataset.act==="note"){const r=S.runs.find(x=>x.id===t.dataset.r);r.notes[t.dataset.i]=t.value;save()}});

/* Какое право базы нужно действию (schema.sql, permissions): без него кнопка только объясняет. */
const ACT_NEED={done:"work",trig:"work",send:"work",cmtbook:"work",runfinish:"work",repsave:"work",repclose:"work",fix:"work",wellsave:"well",
 usave:"fleet_edit",retireok:"fleet_edit",unretire:"fleet_edit",udelok:"fleet_edit",nsave:"fleet_edit",noff:"fleet_edit"};

/* ================== САЙТ: вход, загрузка из базы, отправка ==================
   Вход по почте и паролю; автор правки — вошедший (база ставит имя сама). При запуске экран сразу показывает то,
   что лежит в телефоне (последняя загрузка + неотправленное), затем подтягивает базу. Без связи всё сохраняется
   в телефоне и уходит само (site/data.js). Правки других приходят через realtime, раз в минуту и при возврате. */
// Мок — только в тестовой сборке (build.py --mock); проверка по функции, не по глобальной переменной.
const READY = typeof makeMockSupabase === "function" || /^https:\/\//.test(SB_URL);   // адрес базы ещё не вписан — только вход
const DB = READY ? makeDb(typeof makeMockSupabase === "function" ? MOCK_SB.createClient : supabase.createClient) : null;
let ME = null, SYNC = null, R = null, BASE = null, BOOTED = false, WAIT = false, rtOff = null, rtT = null, SYNCED = "";

const emptyR = () => Object.fromEntries(DB_TABLES.map(t => [t, []]));
const uiRole = (role, saved) => role === "admin" ? (ROLES[saved] ? saved : "gm") : role === "viewer" ? "gd" : role;
// Неотправленное поверх загруженного из базы: экран показывает то, что человек уже сделал.
function overlay(R0, ops) {
  const R1 = clone(R0);
  for (const o of ops) {
    const arr = R1[o.t] || (R1[o.t] = []), k = rowKey(o.t, o.row), i = arr.findIndex(x => rowKey(o.t, x) === k);
    if (o.op === "delete") { if (i >= 0) arr.splice(i, 1); }
    else if (i >= 0) arr[i] = { ...arr[i], ...o.row };
    else arr.push({ ...o.row, by_name: ME.name, who: ME.name, at: null, v: 1 });
  }
  return R1;
}
function rebuild() {
  const ui = { tab: S.tab, draft: S.draft, runs: S.runs, role: S.role };
  const x = fromRows(overlay(R, SYNC.pendingRows()), SYNC.pendingIds());
  S = { ...x, ...ui, online: S.online, queue: SYNC.size };
  BASE = toRows(S);
}
function save() {
  if (!BOOTED) return;
  IDB.set("ui", { tab: S.tab, draft: S.draft, runs: S.runs, role: S.role });
  const cur = toRows(S), ops = diffRows(BASE, cur);
  BASE = cur;
  if (ops.length) { SYNC.enqueue(ops); S.queue = SYNC.size; header(); }
}
// Человек печатает или открыто окно правки — свежие данные покажем после (иначе перерисовка съест ввод).
const busy = () => !!document.activeElement && document.activeElement.matches("input,textarea,select") || !!ED || !!NE;
async function reload(sent) {
  R = await DB.load();
  IDB.set("R", R);
  if (sent) SYNCED = now();
  if (busy()) { WAIT = true; return; }
  rebuild(); render(); refreshSheet();
}
function rejected(o, text) {
  toast("База не приняла" + (o ? " (" + ({ book: "запись книжки", hours: "наработка", units: "карточка", norms: "норма", log: "журнал",
    repairs: "ремонт", pend: "событие", well: "скважина" }[o.t] || o.t) + ")" : "") + ": " + text);
}

/* ---- вход ---- */
function showLogin(msg) {
  const w = $("#login"); w.hidden = false;
  $("#lgErr").textContent = msg || "";
  $("#loginF").onsubmit = async e => {
    e.preventDefault(); const b = $("#lgB"); b.disabled = true; $("#lgErr").textContent = "";
    try { await DB.signIn($("#lgE").value.trim(), $("#lgP").value); await start(); }
    catch (x) { $("#lgErr").textContent = dbErr(x).text; }
    finally { b.disabled = false; }
  };
  setTimeout(() => $("#lgE").focus(), 0);
}
async function start() {
  const meC = await IDB.get("me");
  try { ME = await DB.me(); }
  catch (e) { if (dbErr(e).kind === "net" && meC) ME = meC; else return showLogin(dbErr(e).text); }
  if (!ME) { await DB.signOut(); return showLogin("У вас ещё нет роли — администратору: Table Editor → profiles → role"); }
  if (meC && meC.uid !== ME.uid) await IDB.clear();          // в телефоне был другой человек — его кэш не показываем
  IDB.set("me", ME);
  SYNC = makeSync(DB, { reload, status: net => { S.online = !net; S.queue = SYNC.size; header(); }, rejected });
  await SYNC.init();
  const ui = (await IDB.get("ui")) || {};
  R = (await IDB.get("R")) || emptyR();
  S.tab = ui.tab || (ME.role === "master" ? "svodka" : ME.role === "gm" ? "sroki" : ME.role === "gd" ? "equip" : "svodka");
  S.draft = ui.draft || {}; S.runs = ui.runs || []; S.role = uiRole(ME.role, ui.role);
  rebuild(); BOOTED = true; $("#login").hidden = true; render();
  SYNC.run(); liveSub();
}
async function siteLogout() {
  if (SYNC && SYNC.size) return toast("Не всё отправлено (" + SYNC.size + ") — выйти можно, когда появится связь и всё уйдёт");
  if (rtOff) rtOff();
  await DB.signOut(); await IDB.clear(); location.reload();
}

/* ---- обновления ---- */
function liveSub() {
  if (rtOff) rtOff();
  rtOff = DB.subscribe(() => { clearTimeout(rtT); rtT = setTimeout(() => SYNC.run(), 400); },
    st => { if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") setTimeout(liveSub, 20000); });
}
document.addEventListener("visibilitychange", () => { if (SYNC && !document.hidden) SYNC.run(); });
addEventListener("online", () => { if (SYNC) SYNC.run(); });
addEventListener("offline", () => { S.online = false; if (BOOTED) header(); });
setInterval(() => { if (WAIT && BOOTED && !busy()) { WAIT = false; rebuild(); render(); refreshSheet(); } }, 1000);
setInterval(() => { if (SYNC && !document.hidden) SYNC.run(); }, 60000);
// Попросить браузер не стирать данные сайта (iPhone: вместе с установкой на экран «Домой»).
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

(async () => {
  if (!READY) return showLogin("Сайт ещё не подключён к базе — администратору: docs/DEPLOY.md");
  let s = null;
  try { s = await DB.session(); } catch (e) {}
  if (!s) return showLogin();
  try { await start(); } catch (e) { showLogin(dbErr(e).text); }
})();
